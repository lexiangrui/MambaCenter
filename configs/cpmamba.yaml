# CP-Mamba (B5): coarse P3 heatmap -> centre prior S -> CP-SSM at P2
# (prior-raised Δ, low-to-high priority route over the top-15% prior tokens).
base: mambafpn.yaml
name: cpmamba
arch: cpmamba_34
model:
  cp:
    use_cp_block: true
    regular_routes: [h, v]      # dense horizontal / vertical routes
    delta_mod: true             # Δ = softplus(W x + b + α s), α >= 0, α0 = 0
    priority: true
    sparse_ratio: 0.15          # ρ
    extra_ratio: 0.05           # random extra tokens while training
    bins: 4                     # B
    descending: false           # candidates last
    dilate: true                # 3x3 max-pool of the upsampled prior
    detach_prior: false         # CP-SSM gradient flows into the coarse branch
    warmup_epochs: 5            # priority route off, then
    ramp_epochs: 5              # faded in linearly
    head_conv: 128
loss:
  coarse_weight: 0.5            # λ_c
