# IA-Mamba (A4): innovation-driven IA-VSS at every level, E maps of P2-P4 into the heatmap head.
base: mambafpn.yaml
name: iamamba
arch: iamamba_34
model:
  ia:
    kernel: 7                   # local normalisation window k
    tau: 0.5                    # soft-min temperature τ
    fusion: softmin
    local_norm: true
    predictor: linear           # P: d_inner x d_inner, zero-initialised
    modulate: true              # Δ(l+1) = softplus(W x + b) + γ softplus(a E(l) + c)
    to_head: true
    lower_bound: true
    target: delta
    cross_level: false          # design doc: modulation stays inside a level
    head_levels: [0, 1, 2]
loss:
  pred_weight: 0.1              # λ_pred
